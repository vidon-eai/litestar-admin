services:
  db_postgres:
    image: postgres:15-alpine
    profiles:
      - ""
      - postgresql
    restart: always
    env_file:
      - ./backend/env/.env.dev
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-litestaradmin}
      POSTGRES_DB: ${DB_DATABASE:-litestaradmin}
      PGDATA: ${PGDATA:-/var/lib/postgresql/data/pgdata}
    command: >
      postgres -c 'max_connections=${POSTGRES_MAX_CONNECTIONS:-100}'
               -c 'shared_buffers=${POSTGRES_SHARED_BUFFERS:-128MB}'
               -c 'work_mem=${POSTGRES_WORK_MEM:-4MB}'
               -c 'maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-64MB}'
               -c 'effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-4096MB}'
               -c 'statement_timeout=${POSTGRES_STATEMENT_TIMEOUT:-0}'
               -c 'idle_in_transaction_session_timeout=${POSTGRES_IDLE_IN_TRANSACTION_SESSION_TIMEOUT:-0}'
    volumes:
      - ${PGDATA_HOST_VOLUME:-./devops/postgresql/data}:/var/lib/postgresql/data
    ports:
      - "${EXPOSE_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-h",
          "db_postgres",
          "-U",
          "${DB_USERNAME:-postgres}",
          "-d",
          "${DB_DATABASE:-dify}",
        ]
      interval: 1s
      timeout: 3s
      retries: 30

  db_mysql:
    image: mysql:8.0
    profiles:
      - mysql
    restart: always
    env_file:
      - ./backend/env/.env.dev
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-litestaradmin}
      MYSQL_DATABASE: ${DB_DATABASE:-litestaradmin}
    command: >
      --max_connections=${MYSQL_MAX_CONNECTIONS:-1000}
      --innodb_buffer_pool_size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-512M}
      --innodb_log_file_size=${MYSQL_INNODB_LOG_FILE_SIZE:-128M}
      --innodb_flush_log_at_trx_commit=${MYSQL_INNODB_FLUSH_LOG_AT_TRX_COMMIT:-2}
    volumes:
      - ${MYSQL_HOST_VOLUME:-./devops/mysql/data}:/var/lib/mysql
    ports:
      - "${EXPOSE_MYSQL_PORT:-3320}:3306"
    # mysqladmin ping passes during mysql:8.0's TCP-listening stage even while
    # the server is still finalising init, leading to "Lost connection during
    # query" on the first real query. Verify with a real SELECT instead.
    healthcheck:
      test:
        [
          "CMD",
          "mysql",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${DB_PASSWORD:-difyai123456}",
          "-e",
          "SELECT 1",
        ]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 20s


  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4_ui
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: litestaradmin
    ports:
      - "8080:80"
    depends_on:
      - db_postgres